<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机联智检</title><link rel="stylesheet" href="panel.css"></head><body>
<header><strong>Trackunit 辅助工具</strong><div class="actions"><button id="identify">读取当前设备</button><button id="retry">重新连接</button></div><p id="connection" role="status">正在连接本地服务…</p><p id="runtime" role="status"></p><p id="context" role="status">在设备详情页点击插件图标，再读取当前设备。</p><p id="help" hidden></p><div class="connection-options"><a id="standalone" href="http://127.0.0.1:8890/assistant-ui/" target="_blank" rel="noopener">独立窗口</a><details><summary>连接设置</summary><form id="service-form"><label for="service-port">本机服务端口</label><select id="service-port"><option value="8890">8890 · 标准启动</option><option value="8892">8892 · 当前开发预览</option></select><button type="submit">应用并连接</button></form><p>选择与启动命令一致的端口。重新连接会清除当前网页未保存的草稿。</p></details></div></header>
<iframe id="assistant" title="机联智检本地助手"></iframe><script src="context.js"></script><script src="panel.js"></script></body></html>
